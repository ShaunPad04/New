# One-off: fetch an image from a URL the build environment cannot reach and
# commit it into the Paul Fox site's static assets. Dispatched by hand (or by
# an agent) with the source URL and the destination file name. The image is
# resized to at most 1800px on its long edge and saved as a quality-82 JPEG.
name: paul-fox asset

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Source image URL"
        required: true
      name:
        description: "Destination file name inside clients/paul-fox/public/assets (jpg)"
        required: true
        default: "surveyor.jpg"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and convert
        env:
          SOURCE_URL: ${{ inputs.url }}
          DEST: clients/paul-fox/public/assets/${{ inputs.name }}
        run: |
          set -euo pipefail
          mkdir -p clients/paul-fox/public/assets /tmp/tools
          curl -fsSL --retry 3 "$SOURCE_URL" -o /tmp/source
          file /tmp/source
          (cd /tmp/tools && npm init -y >/dev/null && npm install --no-audit --no-fund --silent sharp@0.34.3)
          NODE_PATH=/tmp/tools/node_modules node -e '
            const sharp = require("sharp");
            sharp("/tmp/source").rotate()
              .resize({ width: 1800, height: 1800, fit: "inside", withoutEnlargement: true })
              .jpeg({ quality: 82, mozjpeg: true })
              .toFile(process.env.DEST)
              .then((m) => console.log(process.env.DEST, m.width + "x" + m.height, m.size + " bytes"));
          '

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "paul-fox-asset"
          git config user.email "paul-fox-asset@users.noreply.github.com"
          git add -A clients/paul-fox/public/assets
          git commit -m "chore(paul-fox): add ${{ inputs.name }} to public assets" -m "Fetched by .github/workflows/paul-fox-asset.yml."
          git push
