name: Add Watch Hero Video

on:
  push:
    branches:
      - client/watch-company
    paths:
      - .github/workflows/add-watch-hero.yml

permissions:
  contents: write

jobs:
  add-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout watch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web-ready hero video
        run: |
          mkdir -p clients/watch-company/site/public
          curl --fail --location --retry 3 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3HwrG1wTADv3RkUcvzwwuwfoAUh/0d02551c-b606-4c21-9d91-d3f7915d4160.mp4' \
            --output clients/watch-company/site/public/hero-video.mp4
          test -s clients/watch-company/site/public/hero-video.mp4
          SIZE=$(stat -c%s clients/watch-company/site/public/hero-video.mp4)
          echo "Downloaded hero-video.mp4: ${SIZE} bytes"
          test "$SIZE" -gt 1000000
          test "$SIZE" -lt 5000000

      - name: Commit hero and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-watch-hero.yml
          git add clients/watch-company/site/public/hero-video.mp4
          git commit -m 'Watch concept: add optimized hero video'
          git push origin HEAD:client/watch-company
